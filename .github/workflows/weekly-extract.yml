name: Extracción semanal v2

on:
  schedule:
    - cron: '0 13,15,17,19,21,23 * * 2'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependencias
        run: pip install requests psycopg2-binary

      - name: Extraer Lonja de Sevilla
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python extract_historico.py --recent

      - name: Extraer Lonja de Córdoba
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python extract_cordoba.py --recent

      - name: Mantener repo activo
        run: |
          date > last_update.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_update.txt
          git diff --staged --quiet || git commit -m "Auto update"
          git pull origin main --rebase --autostash
          git push origin main
        continue-on-error: true
