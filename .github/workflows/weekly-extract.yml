name: Extracción semanal de precios

on:
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Extraer Lonja de Sevilla
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python extract_historico.py --recent

      - name: Extraer Lonja de Córdoba
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python extract_cordoba.py --recent

      - name: Mantener repo activo (evita que GitHub desactive el cron)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Última actualización: $(date '+%Y-%m-%d %H:%M UTC')" > last_update.txt
          git add last_update.txt
          git commit -m "Auto: actualización semanal $(date '+%Y-%m-%d')"
          git push
